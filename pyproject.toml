[project]
name = "qbitflow"
version = "0.1.0"
description = "Rule-driven automation for qBittorrent, informed by your media libraries and disk usage."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "apscheduler>=3.11",
    "croniter>=6.0",
    "cron-descriptor>=1.4",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "psutil>=6.1",
    "structlog>=24.4",
    "rapidfuzz>=3.11",
    "pyyaml>=6.0",
    "regex>=2026.9.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "hypothesis>=6.123",
    "ruff>=0.9",
    # Screenshots only (scripts/screenshots.py). Never imported by the app or the
    # test suite, so a machine without a browser can still run everything else.
    "playwright>=1.49",
]

[project.scripts]
qbitflow = "qbitflow.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qbitflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:qbitflow.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
