{% extends "base.html" %}
{% from "partials/icons.html" import icon %}
{% block title %}Runs · qbitflow{% endblock %}
{% block content %}
<div x-data="runsPage()" x-init="load()" class="space-y-5">

  <div class="flex flex-wrap items-end justify-between gap-3">
    <div>
      <h1 class="page-title">Run history</h1>
      <p class="page-subtitle">
        <span x-text="formatCount(total)"></span> runs recorded. Older runs are pruned
        automatically.
      </p>
    </div>
    <label class="flex items-center gap-2 text-sm">
      <span class="sr-only">Filter by status</span>
      {{ icon('filter', 'h-4 w-4 text-zinc-400') }}
      <select x-model="status" @change="offset = 0; load()" class="select w-auto">
        <option value="">All statuses</option>
        <option value="succeeded">Succeeded</option>
        <option value="failed">Failed</option>
        <option value="running">Running</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </label>
  </div>

  <section class="card overflow-hidden">
    <div x-show="loading" class="space-y-2 p-4">
      <template x-for="i in 5" :key="i"><div class="skeleton h-5 w-full"></div></template>
    </div>

    <template x-if="!loading && runs.length === 0">
      <div class="empty">
        <span class="grid h-11 w-11 place-items-center rounded-xl bg-teal-50 text-teal-600 dark:bg-teal-950 dark:text-teal-400">
          {{ icon('clock', 'h-5 w-5') }}
        </span>
        <p class="empty-title" x-text="status ? 'No ' + status + ' runs' : 'Nothing has run yet'"></p>
        <p class="empty-hint" x-show="!status">
          Runs appear here once a rule fires — on its schedule, or from
          <em>Run now</em> on the dashboard.
        </p>
        <button x-show="status" @click="status = ''; offset = 0; load()" class="btn mt-2">
          Show all runs
        </button>
      </div>
    </template>

    <div class="overflow-x-auto" x-show="!loading && runs.length > 0" x-cloak>
      <table class="table">
        <thead>
          <tr>
            <th>Started</th>
            <th>Trigger</th>
            <th>Status</th>
            <th class="num">Evaluated</th>
            <th class="num">Matched</th>
            <th class="num">Applied</th>
            <th class="num">Skipped</th>
            <th class="num">Errors</th>
            <th class="num">Took</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="run in runs" :key="run.id">
            <tr>
              <td><a :href="'/runs/' + run.id" class="link" x-text="formatTime(run.started_at)"></a></td>
              <td class="text-zinc-500">
                <span x-text="run.trigger"></span>
                <span x-show="run.dry_run" class="text-violet-500"> · dry</span>
              </td>
              <td><span class="badge" :class="statusClass(run.status)" x-text="run.status"></span></td>
              <td class="num text-zinc-500" x-text="formatCount(run.torrents_evaluated)"></td>
              <td class="num" x-text="formatCount(run.torrents_matched)"></td>
              <td class="num">
                <span x-text="formatCount(run.actions_applied)"></span>
                <span x-show="run.actions_would_apply" class="text-violet-500"
                      x-text="'(' + run.actions_would_apply + ')'"></span>
              </td>
              <td class="num text-zinc-500" x-text="formatCount(run.actions_skipped)"></td>
              <td class="num" :class="run.error_count ? 'text-rose-600 dark:text-rose-400' : 'text-zinc-400'"
                  x-text="run.error_count"></td>
              <td class="num text-zinc-500"
                  x-text="run.duration_ms === null ? '—' : (run.duration_ms / 1000).toFixed(1) + 's'"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <div class="flex items-center justify-between border-t border-zinc-200 px-4 py-2 dark:border-zinc-800"
         x-show="total > limit" x-cloak>
      <button @click="page(-1)" :disabled="offset === 0" class="btn btn-sm">
        {{ icon('chevron-left', 'h-3 w-3') }} Previous
      </button>
      <span class="text-xs text-zinc-500"
            x-text="(offset + 1) + '–' + Math.min(offset + limit, total) + ' of ' + total"></span>
      <button @click="page(1)" :disabled="offset + limit >= total" class="btn btn-sm">
        Next {{ icon('chevron-right', 'h-3 w-3') }}
      </button>
    </div>
  </section>
</div>

<script>
function runsPage() {
  return {
    runs: [], total: 0, limit: 50, offset: 0, status: '', loading: true,

    async load() {
      try {
        var url = '/api/runs?limit=' + this.limit + '&offset=' + this.offset;
        if (this.status) url += '&status=' + this.status;
        var r = await api('GET', url);
        this.runs = r.runs;
        this.total = r.total;
      } catch (e) { toast(e.message, false); } finally { this.loading = false; }
    },

    page(direction) {
      this.offset = Math.max(0, this.offset + direction * this.limit);
      this.load();
    },

    statusClass(status) {
      var MAP = {
        succeeded: 'badge-ok', failed: 'badge-error',
        running: 'badge-info', cancelled: 'badge-muted'
      };
      return MAP[status] || 'badge-muted';
    }
  };
}
</script>
{% endblock %}
