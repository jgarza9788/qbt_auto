{% extends "base.html" %}
{% from "partials/icons.html" import icon %}
{% block title %}Run {{ run_id }} · qbitflow{% endblock %}
{% block content %}
<div x-data="runDetail({{ run_id }})" x-init="load()" class="space-y-4">

  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <a href="/runs" class="link text-sm">&larr; All runs</a>
      <h1 class="page-title mt-1">Run #{{ run_id }}</h1>
      <p class="page-subtitle" x-text="subtitle()"></p>
    </div>
    <span class="badge px-3 py-1 text-sm" :class="statusClass(run.status)" x-text="run.status"></span>
  </div>

  <div class="grid gap-3 sm:grid-cols-3 lg:grid-cols-6">
    <template x-for="card in cards()" :key="card.label">
      <div class="card p-3">
        <p class="eyebrow" x-text="card.label"></p>
        <p class="mt-0.5 text-xl font-semibold tabular-nums" :class="card.class" x-text="card.value"></p>
      </div>
    </template>
  </div>

  <template x-if="run.summary && run.summary.source_errors && run.summary.source_errors.length">
    <div class="notice notice-warn block">
      <p class="font-medium">Source problems during this run</p>
      <ul class="mt-1 list-disc pl-5">
        <template x-for="err in run.summary.source_errors" :key="err">
          <li x-text="err"></li>
        </template>
      </ul>
    </div>
  </template>

  <section class="card overflow-hidden">
    <div class="card-header"><h2 class="section-title">Per-rule results</h2></div>
    <template x-if="(run.rule_results || []).length === 0">
      <p class="px-4 py-6 text-center text-sm text-zinc-500">No rules were evaluated.</p>
    </template>
    <div class="overflow-x-auto" x-show="(run.rule_results || []).length > 0">
      <table class="table">
        <thead>
          <tr>
            <th>Rule</th>
            <th class="num">Matched</th>
            <th class="num">Applied</th>
            <th class="num">Would apply</th>
            <th class="num">Skipped</th>
            <th class="num">Errors</th>
            <th class="num">Took</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="r in run.rule_results" :key="r.rule_name + r.rule_id">
            <tr>
              <td>
                <span class="font-medium" x-text="r.rule_name"></span>
                <p x-show="r.error" class="text-xs text-rose-600 dark:text-rose-400" x-text="r.error"></p>
              </td>
              <td class="num" x-text="formatCount(r.matched)"></td>
              <td class="num" x-text="formatCount(r.applied)"></td>
              <td class="num text-violet-600 dark:text-violet-400" x-text="formatCount(r.would_apply)"></td>
              <td class="num text-zinc-500" x-text="formatCount(r.skipped)"></td>
              <td class="num" :class="r.errors ? 'text-rose-600 dark:text-rose-400' : 'text-zinc-400'"
                  x-text="r.errors"></td>
              <td class="num text-zinc-500"
                  x-text="r.duration_ms === null ? '—' : r.duration_ms + ' ms'"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </section>

  <section class="card overflow-hidden">
    <div class="card-header">
      <h2 class="section-title">Log</h2>
      <div class="flex items-center gap-3 text-xs text-zinc-500">
        <label class="flex items-center gap-1.5">
          <input type="checkbox" class="checkbox" x-model="errorsOnly"> Errors only
        </label>
        <span x-show="streaming" class="badge badge-info">
          <span class="spinner h-2.5 w-2.5 border"></span> streaming
        </span>
      </div>
    </div>
    <div class="max-h-[28rem] overflow-auto px-4 py-3 font-mono text-xs" x-ref="logbox">
      <template x-if="visibleLines().length === 0">
        <p class="py-6 text-center font-sans text-sm text-zinc-500">No log entries.</p>
      </template>
      <template x-for="line in visibleLines()" :key="line.seq">
        <div class="flex gap-2 py-0.5">
          <span class="shrink-0 text-zinc-400" x-text="formatClock(line.timestamp)"></span>
          <span class="w-12 shrink-0 uppercase"
                :class="line.level === 'error' ? 'text-rose-600 dark:text-rose-400'
                        : (line.level === 'warning' ? 'text-amber-600 dark:text-amber-400' : 'text-zinc-400')"
                x-text="line.level"></span>
          <span class="break-all" x-text="line.message"></span>
        </div>
      </template>
    </div>
  </section>
</div>

<script>
function runDetail(runId) {
  return {
    runId: runId, run: {}, lines: [], errorsOnly: false, streaming: false, source: null,

    async load() {
      try {
        this.run = await api('GET', '/api/runs/' + this.runId);
      } catch (e) { toast(e.message, false); return; }
      this.stream();
    },

    // Replays what is persisted, then follows anything new. Sequence numbers
    // make the two halves safe to concatenate whether the run is live or done.
    stream() {
      var self = this;
      this.streaming = true;
      var source = new EventSource('/api/runs/' + this.runId + '/stream');
      this.source = source;

      source.addEventListener('log', function (event) {
        var line = JSON.parse(event.data);
        if (self.lines.some(function (l) { return l.seq === line.seq; })) return;
        self.lines.push(line);
        self.$nextTick(function () {
          var box = self.$refs.logbox;
          if (box) box.scrollTop = box.scrollHeight;
        });
      });

      source.addEventListener('done', function () {
        self.streaming = false;
        source.close();
        api('GET', '/api/runs/' + self.runId).then(function (r) { self.run = r; });
      });

      source.onerror = function () { self.streaming = false; source.close(); };
    },

    visibleLines() {
      if (!this.errorsOnly) return this.lines;
      return this.lines.filter(function (l) { return l.level === 'error' || l.level === 'warning'; });
    },

    subtitle() {
      if (!this.run.started_at) return '';
      var parts = [new Date(this.run.started_at).toLocaleString(), this.run.trigger];
      if (this.run.dry_run) parts.push('dry run');
      if (this.run.duration_ms !== null && this.run.duration_ms !== undefined) {
        parts.push((this.run.duration_ms / 1000).toFixed(1) + 's');
      }
      return parts.join(' · ');
    },

    cards() {
      var r = this.run;
      return [
        {label: 'Evaluated', value: formatCount(r.torrents_evaluated), class: ''},
        {label: 'Rules', value: formatCount(r.rules_evaluated), class: ''},
        {label: 'Matched', value: formatCount(r.torrents_matched), class: ''},
        {label: 'Applied', value: formatCount(r.actions_applied),
         class: 'text-emerald-600 dark:text-emerald-400'},
        {label: 'Would apply', value: formatCount(r.actions_would_apply),
         class: 'text-violet-600 dark:text-violet-400'},
        {label: 'Errors', value: r.error_count ?? '—',
         class: r.error_count ? 'text-rose-600 dark:text-rose-400' : ''}
      ];
    },

    statusClass(status) {
      var MAP = {
        succeeded: 'badge-ok', failed: 'badge-error',
        running: 'badge-info', cancelled: 'badge-muted'
      };
      return MAP[status] || 'badge-muted';
    },

    formatClock(iso) {
      try { return new Date(iso).toLocaleTimeString(); } catch (e) { return ''; }
    }
  };
}
</script>
{% endblock %}
