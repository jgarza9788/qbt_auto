{% extends "base.html" %}
{% from "partials/logo.html" import logo_tile %}
{% block title %}Sign in · qbitflow{% endblock %}
{% block content %}
<div class="mx-auto mt-16 w-full max-w-sm">
  <div class="mb-6 text-center">
    <div class="mx-auto mb-3 flex justify-center">{{ logo_tile("h-12 w-12", "h-7 w-7") }}</div>
    <h1 class="text-xl font-semibold tracking-tight">Sign in to qbitflow</h1>
  </div>

  <form method="post" action="/login"
        class="card space-y-4 p-6">
    {% if error %}
      <p class="notice notice-error px-3 py-2">
        {{ error }}
      </p>
    {% endif %}
    <div>
      <label for="username" class="label">Username</label>
      <input id="username" name="username" value="{{ username or '' }}" required autofocus autocomplete="username"
             class="input py-2">
    </div>
    <div>
      <label for="password" class="label">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"
             class="input py-2">
    </div>
    <button class="btn btn-primary w-full py-2">
      Sign in
    </button>
  </form>
</div>
{% endblock %}
