name: Docker

on:
  push:
    branches: ["master", "Dev*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      # Required for the signed provenance attestation.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      # arm64 is the platform most of these installs actually run on -- a Pi or a
      # NAS -- so it is built on every change, not only on release.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # A pull request from a fork cannot have registry credentials, so it builds
      # and never pushes. That is the point: the build itself is the check.
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            # "latest" must only ever mean the default branch. A tag pushed from
            # a work branch that quietly became :latest is how people end up
            # running something nobody intended to release.
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest the build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  smoke:
    # Proves the image actually starts, migrates an empty volume and serves the
    # setup page -- which is the first thing a new user sees and the last thing a
    # unit test can tell you about.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pulled by digest, not by tag: this must smoke-test the image the build
      # job actually produced, not whatever the tag points at by the time it runs.
      - name: Start the container
        run: |
          docker run -d --name qbitflow \
            -p 8080:8080 \
            -e QBITFLOW_DATA_DIR=/data \
            -v "$PWD/ci-data:/data" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}

      - name: Wait for it to become healthy
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              echo "healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the container never became healthy"
          docker logs qbitflow
          exit 1

      - name: A fresh install offers the setup wizard
        run: |
          curl -fsS -L http://localhost:8080/ | grep -qi "setup" \
            || (echo "::error::the first page was not the setup wizard" && docker logs qbitflow && exit 1)

      - name: Show the startup log
        if: always()
        run: docker logs qbitflow
