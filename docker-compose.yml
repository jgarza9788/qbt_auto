services:
  qbitflow:
    image: ghcr.io/jgarza9788/qbitflow:latest
    # Comment the image line and uncomment this to build locally.
    # build: .
    container_name: qbitflow
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # --- identity -----------------------------------------------------
      # Match these to the user that owns your media, or qBittorrent will not
      # be able to read files this app moves.
      PUID: "1000"
      PGID: "1000"
      TZ: "UTC"

      # --- storage ------------------------------------------------------
      QBITFLOW_DATA_DIR: "/data"
      QBITFLOW_EXPORTS_DIR: "/exports"
      # Back this up. Losing it means re-entering every stored credential.
      # QBITFLOW_SECRET_KEY: ""

      # --- server -------------------------------------------------------
      # QBITFLOW_ALLOWED_HOSTS: "qbitflow.example.com,localhost"
      # QBITFLOW_BEHIND_PROXY: "true"
      QBITFLOW_LOG_LEVEL: "INFO"
      # QBITFLOW_LOG_JSON: "true"

      # --- behaviour ----------------------------------------------------
      # The script.run action executes commands on this host. Off unless asked for.
      # QBITFLOW_ENABLE_SCRIPT_ACTION: "true"

      # --- source credentials (optional; these override the UI and are never
      # written back to the database, so secrets can stay out of the volume) ---
      # QBITFLOW_SOURCE__MAIN_QBT__BASE_URL: "http://qbittorrent:8080"
      # QBITFLOW_SOURCE__MAIN_QBT__USERNAME: "admin"
      # QBITFLOW_SOURCE__MAIN_QBT__SECRET: ""
    volumes:
      - ./data:/data
      - ./exports:/exports
      - ./scripts:/scripts
      # Mount every path you want disk-usage rules for. Path mappings in the UI
      # translate between these and the paths qBittorrent or Plex report, so
      # they do not have to be identical.
      # - /mnt/media:/mnt/media
      # - /mnt/downloads:/mnt/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
