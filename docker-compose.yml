services:
  qbit-flow:
    build: .
    image: ghcr.io/jgarza9788/qbit-flow:latest
    container_name: qbit-flow
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__Db=Data Source=/data/qbitflow.db
      - TZ=America/Los_Angeles

      # --- secrets at rest ---
      - SECRETS_ENCRYPTION=none        # none (base64) | dpapi (Data Protection key ring)
      # - SECRETS_KEY_DIR=/data/keys   # used only when SECRETS_ENCRYPTION=dpapi

      # --- optional access gate (overrides the Settings page when set) ---
      # - AUTH_MODE=basic              # none | apikey | basic
      # - AUTH_SECRET=change-me

      # --- first-boot import of a legacy config.json ---
      # - CONFIG_IMPORT_PATH=/config/config.json

      # --- where torrent.export writes ---
      - EXPORTS_DIR=/exports

      # --- per-source secret overrides (never persisted) ---
      # - QBT_URL=http://192.168.1.10:8080
      # - QBT_USER=admin
      # - QBT_PWD=...
      # - PLEX_URL=http://192.168.1.10:32400
      # - PLEX_TOKEN=...
    volumes:
      - ./data:/data                  # SQLite db + Serilog logs + Data Protection keys
      - ./config:/config:ro           # optional legacy config.json for first-boot import
      - ./exports:/exports            # .torrent files written by torrent.export
      - ./scripts:/scripts            # working dirs for script.run
      # torrent.move / script.run / drive fields only work if the container sees the SAME
      # paths as qBittorrent — bind-mount the media root identically:
      # - /media:/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
