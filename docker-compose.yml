# 192.168.1.106:8087 -> qbitflow:8080
#
# Only QBITFLOW_DATA_DIR and QBITFLOW_LOCATION are real -- see README.md for what
# every setting actually does. Everything else (parallelism, dry-run, kill switch,
# theme, log level, timezone, path mappings, instance credentials) is configured
# from the Settings/Instances pages after first boot, not env vars.

services:
  qbitflow:
    build:
      context: /home/tbp/projects/qbitflow/
      dockerfile: Dockerfile

    container_name: qbitflow
    ports:
      - "8087:8080"
    environment:
      TZ: ${TIMEZONE}

      # SQLite DB + Data Protection key ring (credential encryption). Already
      # defaults to /data in the image; only set this if you want it elsewhere.
      QBITFLOW_DATA_DIR: "/data"

    volumes:
      # SQLite db + Data Protection keys. Back this up -- losing the key ring
      # means every stored instance credential becomes unreadable and has to
      # be re-entered.
      - ${QBITFLOW_LOCATION}/data:/data

      # Rolling log files (qbitflow-YYYY-MM-DD.log, last 7 days kept).
      - ${QBITFLOW_LOCATION}/log:/log

      # Mount every path you want disk-usage rules for, and/or that "move"
      # actions need to see to verify a move completed. Path mappings in the
      # Settings page translate between these and whatever qBittorrent/Plex
      # report, so the mount points don't have to match exactly.
      # - /mnt/media:/mnt/media
      # - /mnt/downloads:/mnt/downloads

    # A Streamystats instance is read from its PostgreSQL database rather than over
    # HTTP (its API can't serve playback history to a server-to-server client, and
    # carries no file path -- see README). qbitflow therefore needs to reach that
    # database: either join the network its compose file creates, as below, and use
    # the service name ("vectorchord:5432") as the instance's Base URL, or publish
    # 5432 on the Streamystats side and point at the host address instead.
    # networks:
    #   - default
    #   - streamystats_default

    restart: unless-stopped
    healthcheck:
      # wget, not curl: the Alpine image has busybox wget and no curl.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

# Uncomment alongside the networks block above when reading a Streamystats database
# that lives in another compose project. The name is "<project-dir>_<network>", which
# `docker network ls` will show you.
# networks:
#   streamystats_default:
#     external: true
